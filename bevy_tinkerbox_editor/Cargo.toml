[package]
name = "bevy_tinkerbox_editor"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = {workspace = true}
bevy_ui_text_input = {workspace = true}
cosmic-text = {workspace = true}
rand = {workspace = true}
serde = {workspace = true}
bevy_file_dialog = {workspace = true}
zvariant = {workspace = true}
zvariant_derive = {workspace = true}
zvariant_utils = {workspace = true}
thiserror = {workspace = true}

[features]
# Default to a native dev build.
default = ["dev_native"]
dev = [
    # Improve compile times for dev builds by linking Bevy as a dynamic library.
    "bevy/dynamic_linking",
    "bevy/bevy_dev_tools",
    "bevy/bevy_ui_debug",
    "bevy/serialize",
    # Improve error messages coming from Bevy
    "bevy/track_location",
    "bevy/experimental_bevy_ui_widgets",
]
dev_native = [
    "dev",
    # Enable asset hot reloading for native dev builds.
    "bevy/file_watcher",
    # Enable embedded asset hot reloading for native dev builds.
    "bevy/embedded_watcher",
    "bevy/multi_threaded"
]
